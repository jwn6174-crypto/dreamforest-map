function pieSVG(names) {
  const n = names.length;
  if (n === 0) {
    return { svg: '<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="#fff" stroke="#555" stroke-width="1.6"/><circle cx="7" cy="7" r="2" fill="#555"/></svg>', size: 14 };
  }
  const d = Math.min(14 + 4.5 * (n - 1), 32), r = d / 2 - 1.2, c = d / 2;
  const counts = {};
  names.forEach(nm => { const k = DATA.classOf[nm] || '미상'; counts[k] = (counts[k] || 0) + 1; });
  const order = DATA.classes.map(x => x[0]).filter(k => counts[k]);
  let parts = '';
  if (order.length === 1) {
    parts = `<circle cx="${c}" cy="${c}" r="${r}" fill="${CCOL[order[0]]}"/>`;
  } else {
    let a0 = -Math.PI / 2;
    order.forEach(k => {
      const a1 = a0 + 2 * Math.PI * counts[k] / n;
      const x0 = c + r * Math.cos(a0), y0 = c + r * Math.sin(a0), x1 = c + r * Math.cos(a1), y1 = c + r * Math.sin(a1);
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      parts += `<path d="M${c},${c} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${CCOL[k]}" stroke="#fff" stroke-width="0.8"/>`;
      a0 = a1;
    });
  }
  parts += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#fff" stroke-width="1.6"/>`;
  return { svg: `<svg width="${d}" height="${d}" viewBox="0 0 ${d} ${d}" style="filter:drop-shadow(0 0 1px rgba(0,0,0,.6))">${parts}</svg>`, size: d };
}

function statusSVG(p) {
  const col = STATUS_COLOR[p.status] || '#9e9e9e', s = 16;
  let shape;
  if (p.zone === '상부') shape = `<polygon points="8,1.5 15,14.5 1,14.5" fill="${col}" stroke="#fff" stroke-width="1.6"/>`;
  else if (p.zone === '중부') shape = `<rect x="2" y="2" width="12" height="12" fill="${col}" stroke="#fff" stroke-width="1.6"/>`;
  else shape = `<circle cx="8" cy="8" r="6.2" fill="${col}" stroke="#fff" stroke-width="1.6"/>`;
  return { svg: `<svg width="${s}" height="${s}" viewBox="0 0 16 16" style="filter:drop-shadow(0 0 1px rgba(0,0,0,.6))">${shape}</svg>`, size: s };
}

function iconFor(p, mode) {
  const g = mode === 'pie' ? pieSVG(p.sp) : statusSVG(p);
  return { content: `<div class="pt">${g.svg}<span class="lbl">${esc(p.id)}</span></div>`,
           size: new naver.maps.Size(g.size, g.size), anchor: new naver.maps.Point(g.size / 2, g.size / 2) };
}

function infoHTML(p) {
  const chips = p.sp.length ? p.sp.map(nm => `<span class="chip"><i style="background:${CCOL[DATA.classOf[nm]] || '#ccc'}"></i>${esc(nm)}</span>`).join('')
                            : '<span style="color:#888">수종 기록 없음</span>';
  const rows = p.recs.map(r => `<tr><td>${esc(r.time)}</td><td>${esc(r.type || '-')}</td><td>${esc(r.sp || '-')}</td><td>${esc(r.match || '—')}</td></tr>`).join('');
  const st = esc(STATUS_LABEL[p.status] || p.status);
  return `<div class="iw"><b class="t">${esc(p.id)}</b> · ${esc(p.zone)} 조 · 현장 판정 <b style="color:${STATUS_COLOR[p.status]}">${st}</b><br>` +
         `<div style="margin-top:4px">${chips}</div>` +
         `<table><tr><td><b>시각</b></td><td><b>공간 유형</b></td><td><b>기록지 수종(원문)</b></td><td><b>판정</b></td></tr>${rows}</table>` +
         (p.note ? `<div style="color:#888;margin-top:4px">※ ${esc(p.note)}</div>` : '') + `</div>`;
}

  if (mode === 'pie') {
    document.getElementById('legend-title').textContent = '범례 · 수종군 (원 크기 = 수종 수)';
    el.innerHTML = DATA.classes.map(([k, c]) => `<div class="legend-item"><span class="sw" style="background:${c}"></span>${esc(k)}</div>`).join('') +
      '<div class="legend-item"><span class="sw round" style="background:#fff;border-color:#555"></span>수종 기록 없음 (시설 등)</div>';
  } else {
    document.getElementById('legend-title').textContent = '범례 · 현장 판정 (모양 = 구역 ▲상 ■중 ●하)';
    el.innerHTML = STATUS_LEGEND.map(([k, c]) => `<div class="legend-item"><span class="sw round" style="background:${c}"></span>${esc(k)}</div>`).join('');
  }
}

function init() {
  const pts = DATA.points;
  const lat = pts.reduce((s, p) => s + p.lat, 0) / pts.length, lon = pts.reduce((s, p) => s + p.lon, 0) / pts.length;
  const map = new naver.maps.Map('map', {
    center: new naver.maps.LatLng(lat, lon), zoom: 16,
    mapTypeControl: true,
    mapTypeControlOptions: { style: naver.maps.MapTypeControlStyle.BUTTON, position: naver.maps.Position.TOP_RIGHT },
    zoomControl: true, zoomControlOptions: { position: naver.maps.Position.RIGHT_CENTER },
    scaleControl: true, logoControl: true, mapDataControl: true
  });
  const info = new naver.maps.InfoWindow({ content: '', borderWidth: 1, borderColor: '#999', backgroundColor: '#fff', anchorSize: new naver.maps.Size(10, 10) });
  let mode = 'pie';
  const markers = pts.map(p => {
    const m = new naver.maps.Marker({ position: new naver.maps.LatLng(p.lat, p.lon), map: map, icon: iconFor(p, mode),
                                      title: p.id, zIndex: 100 - p.sp.length });
    naver.maps.Event.addListener(m, 'click', () => { info.setContent(infoHTML(p)); info.open(map, m); });
    return { p, m };
  });
  const routes = DATA.routes.map(r => ({ zone: r.zone, line: new naver.maps.Polyline({
    map: null, path: r.path.map(([a, b]) => new naver.maps.LatLng(a, b)), strokeColor: DATA.zoneColor[r.zone],
    strokeWeight: 5, strokeOpacity: 0.75, strokeStyle: 'solid', strokeLineCap: 'round', strokeLineJoin: 'round' }) }));

  const zonesOn = () => new Set([...document.querySelectorAll('.zone')].filter(c => c.checked).map(c => c.value));
  function refresh() {
    const on = zonesOn(), showRoutes = document.getElementById('routes').checked;
    markers.forEach(({ p, m }) => m.setMap(on.has(p.zone) ? map : null));
    routes.forEach(r => r.line.setMap(showRoutes && on.has(r.zone) ? map : null));
  }
  function labelState() {
    const want = document.getElementById('labels').checked && map.getZoom() >= 17;
    document.getElementById('map').classList.toggle('show-labels', want);
  }
  document.querySelectorAll('.zone').forEach(c => c.addEventListener('change', refresh));
  document.getElementById('routes').addEventListener('change', refresh);
  document.getElementById('labels').addEventListener('change', labelState);
  document.querySelectorAll('input[name=mode]').forEach(rb => rb.addEventListener('change', e => {
    mode = e.target.value; markers.forEach(({ p, m }) => m.setIcon(iconFor(p, mode))); legend(mode);
  }));
  naver.maps.Event.addListener(map, 'zoom_changed', labelState);
  const b = new naver.maps.LatLngBounds(new naver.maps.LatLng(Math.min(...pts.map(p => p.lat)), Math.min(...pts.map(p => p.lon))),
                                        new naver.maps.LatLng(Math.max(...pts.map(p => p.lat)), Math.max(...pts.map(p => p.lon))));
  map.fitBounds(b);
  legend(mode); refresh(); labelState();
  window.__app = { map, markers, routes };
}

(function load() {
  if (!NCP_KEY_ID || NCP_KEY_ID.indexOf('여기에') === 0) {
    showMsg('<b>아직 네이버 Client ID가 들어 있지 않습니다.</b><br>이 파일을 내려받아 메모장이나 VS Code로 열고, 맨 위 <code>NCP_KEY_ID</code> 따옴표 안에 ' +
            '네이버 클라우드 콘솔에서 받은 Client ID를 붙여넣은 뒤 <code>http://localhost:8000/…</code> 주소로 열어 주세요.<br>' +
            '<span style="color:#888">Claude 앱의 미리보기 창에서는 외부 지도 스크립트가 막혀 있어 네이버 지도가 뜨지 않습니다.</span>');
    return;
  }
  if (location.protocol === 'file:') {
    showMsg('<b>파일을 더블클릭해서 열면 네이버 지도 인증이 되지 않습니다.</b><br>이 파일이 있는 폴더에서 터미널을 열고 <code>python -m http.server 8000</code>을 실행한 뒤, ' +
            '브라우저에서 <code>http://localhost:8000/' + esc(location.pathname.split('/').pop()) + '</code>로 열어 주세요.');
  }
  const s = document.createElement('script');
  s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(NCP_KEY_ID);
  s.onload = () => { if (window.naver && naver.maps) { try { init(); } catch (e) { showMsg('지도를 그리는 중 오류가 났습니다: ' + esc(e.message)); } } };
  s.onerror = () => showMsg('<b>네이버 지도 스크립트를 불러오지 못했습니다.</b><br>Claude 앱 미리보기 창처럼 외부 스크립트를 막는 화면에서 열었거나, 인터넷 연결이 끊긴 경우입니다. ' +
                             '파일을 내려받아 크롬 등 일반 브라우저에서 <code>http://localhost:8000/…</code> 주소로 열어 주세요.');
  document.head.appendChild(s);
})();
</script>
